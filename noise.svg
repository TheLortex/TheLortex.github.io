<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlnsXlink="http://www.w3.org/1999/xlink"
    width="300"
    height="300"
    id="noise"
>
    <filter id="n" x="0" y="0">
        <feTurbulence
            type="fractalNoise"
            baseFrequency="1"
            stitchTiles="stitch"
        />
    </filter>
    <filter id="n2" x="0" y="0">
        <feTurbulence
            type="fractalNoise"
            baseFrequency="0.5"
            stitchTiles="stitch"
        />
    </filter>

    <rect width="300" height="300" fill="#fff" />
    <rect width="300" height="300" filter="url(#n)" opacity="0.80" />
    <rect width="300" height="300" filter="url(#n2)" opacity="0.60" />
</svg>